name: 질문·기타
description: 버그, 기능 제안, 개선에 해당하지 않는 질문이나 논의 주제를 남겨주세요.
title: "[Question] "
labels:
  - question
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        버그 신고나 기능 제안은 전용 템플릿을 사용해주세요.
        개인정보, 비밀번호, API 토큰 등 민감정보는 첨부하지 마세요.

  - type: textarea
    id: question
    attributes:
      label: 질문 또는 논의 내용
      description: 궁금한 점이나 논의하고 싶은 내용을 작성해주세요.
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: 배경 및 시도한 내용
      description: 질문에 이르게 된 상황이나 이미 시도해본 방법이 있으면 작성해주세요.

  - type: textarea
    id: additional
    attributes:
      label: 추가 정보
      description: 참고 자료나 관련 이슈가 있으면 첨부해주세요.

  - type: checkboxes
    id: confirmations
    attributes:
      label: 제출 전 확인
      options:
        - label: 동일하거나 유사한 기존 이슈가 없는지 검색했습니다.
          required: true
        - label: 개인정보, 비밀번호, 토큰 등 민감정보를 포함하지 않았습니다.
          required: true
