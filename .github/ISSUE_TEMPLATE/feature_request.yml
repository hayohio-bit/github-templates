name: ✨ 기능 요청
description: 새로운 기능 또는 개선 사항 제안
title: "[FEATURE] "
labels: ["enhancement"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        기능 제안 이슈 템플릿
        배경과 목적을 구체적으로 작성

  - type: textarea
    id: problem
    attributes:
      label: 해결하고자 하는 문제
      description: 현재 어떤 불편함 또는 제약이 있는지 서술
      placeholder: "현재 ~~한 상황에서 ~~한 문제가 발생"
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 제안하는 해결 방법
      description: 원하는 기능 또는 동작에 대한 구체적 설명
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 검토한 대안
      description: 고려했던 다른 방법과 그것을 채택하지 않은 이유
    validations:
      required: false

  - type: dropdown
    id: priority
    attributes:
      label: 우선순위
      options:
        - Must have
        - Should have
        - Nice to have
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: 추가 참고 자료
      description: 관련 이슈, 참고 링크, 스크린샷 등
    validations:
      required: false
