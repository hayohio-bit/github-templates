name: 기능 제안하기
description: 새로운 기능이나 사용자 경험 개선 아이디어를 제안해주세요.
title: "[Feature] "
labels:
  - enhancement
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        기능 요청의 배경과 기대 효과를 구체적으로 작성해주세요.
        개인정보, 비밀번호, API 토큰 등 민감정보는 첨부하지 마세요.

  - type: textarea
    id: background
    attributes:
      label: 요청 배경
      description: 어떤 문제나 필요 때문에 이 기능이 필요한지 작성해주세요.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 제안 기능
      description: 원하는 동작과 사용 흐름을 구체적으로 작성해주세요.
    validations:
      required: true

  - type: textarea
    id: benefit
    attributes:
      label: 기대 효과
      description: 기능이 제공할 사용자 또는 운영상의 가치를 작성해주세요.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 고려한 대안
      description: 현재 우회 방법이나 검토한 다른 해결책이 있으면 작성해주세요.

  - type: textarea
    id: acceptance
    attributes:
      label: 완료 조건
      description: 완료 판단 조건을 체크리스트로 작성해주세요.
      placeholder: |
        - [ ] 사용자가 ...할 수 있습니다.
        - [ ] ... 상태가 화면에 표시됩니다.
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: 추가 정보
      description: 참고 자료, 관련 이슈 또는 화면 예시가 있으면 첨부해주세요.

  - type: checkboxes
    id: confirmations
    attributes:
      label: 제출 전 확인
      options:
        - label: 동일하거나 유사한 기존 이슈가 없는지 검색했습니다.
          required: true
        - label: 개인정보, 비밀번호, 토큰 등 민감정보를 포함하지 않았습니다.
          required: true
