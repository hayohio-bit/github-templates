name: 버그 신고하기
description: 재현 가능한 문제나 예상과 다른 동작을 알려주세요.
title: "[Bug] "
labels:
  - bug
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        버그를 제보해 주셔서 감사합니다.
        개인정보, 비밀번호, API 토큰 등 민감정보는 첨부하지 마세요.

  - type: textarea
    id: problem
    attributes:
      label: 문제 설명
      description: 어떤 문제가 발생했는지 간결하게 설명해주세요.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: 재현 절차
      description: 문제를 재현할 수 있도록 순서대로 작성해주세요.
      placeholder: |
        1. ... 페이지로 이동합니다.
        2. ... 버튼을 선택합니다.
        3. ... 문제가 발생합니다.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 예상 결과
      description: 정상적으로 동작했다면 어떤 결과가 나와야 하는지 작성해주세요.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 실제 결과
      description: 실제로 확인된 결과를 작성해주세요.
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: 실행 환경
      description: 운영체제, 브라우저와 버전, 기기 등 재현 환경을 작성해주세요.
      placeholder: 예시) Windows 11 / Chrome / 데스크톱
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: 발생 버전
      description: 문제가 발생한 앱 버전, 릴리스 태그 또는 커밋을 알고 있다면 작성해주세요.
      placeholder: 예시) v1.4.2, main 브랜치 a1b2c3d

  - type: textarea
    id: evidence
    attributes:
      label: 로그 및 스크린샷
      description: 원인 파악에 도움이 되는 로그나 화면 자료를 첨부해주세요.

  - type: textarea
    id: additional
    attributes:
      label: 추가 정보
      description: 관련 이슈나 참고할 내용이 있으면 작성해주세요.

  - type: checkboxes
    id: confirmations
    attributes:
      label: 제출 전 확인
      options:
        - label: 동일한 내용의 기존 이슈가 없는지 검색했습니다.
          required: true
        - label: 개인정보, 비밀번호, 토큰 등 민감정보를 포함하지 않았습니다.
          required: true
