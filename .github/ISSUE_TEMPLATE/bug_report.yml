name: 🐛 버그 리포트
description: 예상과 다르게 동작하는 문제 보고
title: "[BUG] "
labels: ["bug", "triage"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        버그 제보 이슈 템플릿
        아래 항목을 최대한 상세히 작성

  - type: textarea
    id: description
    attributes:
      label: 버그 설명
      description: 발생한 문제에 대한 명확하고 간결한 설명
      placeholder: 어떤 상황에서 어떤 문제가 발생했는지 작성
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: 재현 방법
      description: 문제를 재현하기 위한 단계
      placeholder: |
        1. '...' 페이지로 이동
        2. '...' 버튼 클릭
        3. '...' 입력
        4. 에러 확인
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 기대 동작
      description: 정상 동작 시 예상되는 결과
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 실제 동작
      description: 실제로 발생한 결과 (에러 메시지, 화면 등)
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 에러 로그
      description: 콘솔 로그, 스택 트레이스 등
      render: shell
    validations:
      required: false

  - type: dropdown
    id: severity
    attributes:
      label: 심각도
      options:
        - Critical (서비스 불가)
        - High (핵심 기능 장애)
        - Medium (일부 기능 이상)
        - Low (경미한 문제)
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: 실행 환경
      description: OS, 브라우저/런타임 버전, 앱 버전 등
      placeholder: "예: Windows 11, Chrome 126, Node.js v20.11"
    validations:
      required: true

  - type: checkboxes
    id: checklist
    attributes:
      label: 체크리스트
      options:
        - label: 기존 이슈 중 중복 항목 검색 완료
          required: true
        - label: 최신 버전에서 재현 확인
          required: false
