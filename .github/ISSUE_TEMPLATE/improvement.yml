name: 개선·리팩터링 제안하기
description: 기존 코드, 구조 또는 개발 환경의 개선을 제안해주세요.
title: "[Improvement] "
labels:
  - enhancement
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        기존 동작을 유지하면서 개선할 대상과 이유를 구체적으로 작성해주세요.
        개인정보, 비밀번호, API 토큰 등 민감정보는 첨부하지 마세요.

  - type: textarea
    id: current_problem
    attributes:
      label: 현재 문제
      description: 현재 구현의 불편, 복잡성, 중복 또는 유지보수 문제를 작성해주세요.
    validations:
      required: true

  - type: textarea
    id: improvement
    attributes:
      label: 개선 방향
      description: 제안하는 개선 방식과 변경 후 기대하는 구조를 작성해주세요.
    validations:
      required: true

  - type: textarea
    id: impact
    attributes:
      label: 영향 범위
      description: 관련 페이지, 컴포넌트, 데이터, 테스트 또는 사용자 동작을 작성해주세요.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 고려한 대안
      description: 검토한 다른 접근 방식과 선택하지 않은 이유가 있으면 작성해주세요.

  - type: textarea
    id: acceptance
    attributes:
      label: 완료 조건
      description: 개선 완료 판단 조건을 체크리스트로 작성해주세요.
      placeholder: |
        - [ ] 기존 사용자 동작이 유지됩니다.
        - [ ] 관련 테스트가 통과합니다.
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: 추가 정보
      description: 관련 코드, 이슈, 측정 결과 또는 참고 자료가 있으면 첨부해주세요.

  - type: checkboxes
    id: confirmations
    attributes:
      label: 제출 전 확인
      options:
        - label: 동일하거나 유사한 기존 이슈가 없는지 검색했습니다.
          required: true
        - label: 개인정보, 비밀번호, 토큰 등 민감정보를 포함하지 않았습니다.
          required: true
